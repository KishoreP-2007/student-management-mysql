name: Deploy Student Management System to Azure VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Application to Azure VM
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22

          script: |
            set -e

            cd /home/azureuser/student-management-mysql

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci --omit=dev

            echo "Restarting application..."
            if pm2 describe student-management > /dev/null 2>&1; then
              pm2 restart student-management
            else
              pm2 start server.js --name student-management
            fi

            pm2 save

            echo "Deployment completed successfully!"
